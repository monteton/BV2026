<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Просмотр PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* ===== HEADER ===== */
        .pdf-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 16px;
            padding-top: env(safe-area-inset-top);
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background 0.2s;
            text-decoration: none;
        }

        .header-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .header-btn i {
            font-size: 18px;
        }

        .header-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== PDF FRAME (iOS / Desktop) ===== */
        .pdf-frame {
            position: fixed;
            top: calc(56px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            bottom: 0;
            border: none;
            background: #f5f5f5;
            width: 100%;
            height: calc(100% - 56px - env(safe-area-inset-top));
        }

        /* ===== ANDROID OPEN PAGE ===== */
        .android-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: calc(56px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            bottom: 0;
            padding: 32px;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
        }

        .android-icon {
            width: 80px;
            height: 80px;
            background: rgba(92, 189, 13, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .android-icon i {
            font-size: 36px;
            color: #5cbd0d;
        }

        .android-title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .android-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .android-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: #5cbd0d;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(92, 189, 13, 0.3);
        }

        .android-btn:active {
            transform: scale(0.96);
        }

        .android-btn i {
            font-size: 18px;
        }

        .android-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="pdf-header">
        <a class="header-btn" id="backBtn" href="javascript:history.back()">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Назад</span>
        </a>
        <span class="header-title" id="headerTitle"></span>
        <a class="header-btn" id="openBtn" href="#" target="_blank" title="Открыть отдельно" style="display:none">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        const backUrl = params.get('back');
        const title = params.get('title');

        // Назад
        if (backUrl) document.getElementById('backBtn').href = backUrl;

        // Заголовок
        if (title) {
            document.title = title;
            document.getElementById('headerTitle').textContent = title;
        }

        if (file) {
            const ua = navigator.userAgent || '';
            const isAndroid = /Android/i.test(ua);

            if (isAndroid) {
                // Android: красивая страница с кнопкой «Открыть»
                const page = document.createElement('div');
                page.className = 'android-page';
                page.innerHTML = `
                    <div class="android-icon">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <div class="android-title">${title || 'Документ PDF'}</div>
                    <div class="android-subtitle">Нажмите для просмотра<br>с зумом и листанием</div>
                    <a class="android-btn" href="${file}" target="_blank">
                        <i class="fa-solid fa-eye"></i>
                        Открыть PDF
                    </a>
                    <div class="android-hint">Откроется во встроенном просмотрщике</div>
                `;
                document.body.appendChild(page);
            } else {
                // iOS / Desktop: iframe с нативным просмотром
                const openBtn = document.getElementById('openBtn');
                openBtn.href = file;
                openBtn.style.display = 'flex';

                const iframe = document.createElement('iframe');
                iframe.className = 'pdf-frame';
                iframe.setAttribute('allowfullscreen', '');
                iframe.src = file;
                document.body.appendChild(iframe);
            }
        } else {
            document.getElementById('headerTitle').textContent = 'Файл не найден';
        }
    </script>
</body>

</html>
