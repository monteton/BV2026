<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Просмотр PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }
    </style>
    <script>
        // Просто перенаправляем на PDF — браузер откроет его нативным просмотрщиком
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        if (file) {
            window.location.replace(file);
        } else if (window.location.hash) {
            window.location.replace(decodeURIComponent(window.location.hash.substring(1)));
        } else {
            document.title = 'Ошибка';
            document.addEventListener('DOMContentLoaded', () => {
                document.body.style.cssText = 'display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;';
                document.body.textContent = 'Файл не указан';
            });
        }
    </script>
</head>

<body></body>

</html>
