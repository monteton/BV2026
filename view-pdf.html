<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Просмотр PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* ===== HEADER ===== */
        .pdf-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 16px;
            padding-top: env(safe-area-inset-top);
            background: rgba(26, 26, 26, 0.95);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background 0.2s;
            text-decoration: none;
        }

        .header-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .header-btn i {
            font-size: 18px;
        }

        .header-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
        }

        /* ===== PDF CONTAINER ===== */
        .pdf-frame {
            position: fixed;
            top: calc(56px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            bottom: 0;
            border: none;
            background: #f5f5f5;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="pdf-header">
        <a class="header-btn" id="backBtn" href="javascript:history.back()">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Назад</span>
        </a>
        <span class="header-title" id="headerTitle"></span>
        <a class="header-btn" id="openBtn" href="#" target="_blank" title="Открыть отдельно">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        const backUrl = params.get('back');
        const title = params.get('title');

        // Назад
        if (backUrl) document.getElementById('backBtn').href = backUrl;

        // Заголовок
        if (title) {
            document.title = title;
            document.getElementById('headerTitle').textContent = title;
        }

        if (file) {
            // Кнопка «открыть отдельно»
            document.getElementById('openBtn').href = file;

            // Определяем платформу
            const ua = navigator.userAgent || '';
            const isAndroid = /Android/i.test(ua);

            // Создаём iframe
            const iframe = document.createElement('iframe');
            iframe.className = 'pdf-frame';
            iframe.setAttribute('allowfullscreen', '');

            if (isAndroid) {
                // Android: Google Docs Viewer (встроенный зум, скролл)
                const fullUrl = new URL(file, window.location.href).href;
                iframe.src = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(fullUrl);
            } else {
                // iOS / Desktop: нативный просмотрщик браузера
                iframe.src = file;
            }

            document.body.appendChild(iframe);
        } else {
            document.getElementById('headerTitle').textContent = 'Файл не найден';
        }
    </script>
</body>

</html>
