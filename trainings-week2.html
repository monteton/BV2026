<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>Неделя 2 — Еженедельные тренировки</title>
    <!-- ИЗМЕНЕНИЕ: Подключена библиотека иконок для нового меню -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ИЗМЕНЕНИЕ: Общие стили для "мобильной рамки" и фона */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #dcdcdc; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: #F9F4F2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            color: #333;
            text-decoration: none;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            text-align: center; /* Центрируем заголовок */
        }

        main {
            padding: 10px 16px;
            padding-bottom: 20px; /* Отступ снизу */
            flex-grow: 1;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        main::-webkit-scrollbar {
            display: none;
        }
        /* КОНЕЦ ИЗМЕНЕНИЙ для "мобильной рамки" */

        .days-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 100%;
        }
        .day-btn {
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            display: block;
        }
        .day-btn:hover {
            background: #1a2635;
            transform: translateY(-2px);
        }
        
        /* ИЗМЕНЕНИЕ: Новые стили для нижнего меню */
        footer {
            flex-shrink: 0;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #E5E5EA;
            padding-top: 10px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8A8A8E;
            text-decoration: none;
            font-size: 10px;
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #7f817c;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <header>
            <a href="treningmain.html" class="back-button">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1>Неделя 2 — Еженедельные тренировки</h1>
        </header>

        <main>
            <div class="days-group">
                <a href="monday2.html" class="day-btn">Понедельник</a>
                <a href="wednesday2.html" class="day-btn">Среда</a>
                <a href="friday2.html" class="day-btn">Пятница</a>
                <a href="saturday2.html" class="day-btn">Суббота</a>
            </div>
        </main>
        
        <footer>
            <nav class="bottom-nav">
                <a href="main.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Главная</span>
                </a>
                <!-- Вкладка "Тренировки" активна -->
                <a href="treningmain.html" class="nav-item active">
                    <i class="fa-solid fa-dumbbell"></i>
                    <span>Тренировки</span>
                </a>
                <a href="foodmain.html" class="nav-item">
                    <i class="fa-solid fa-utensils"></i>
                    <span>Питание</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Профиль</span>
                </a>
            </nav>
        </footer>
    </div>
</body>
</html>
