<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Лучшая версия себя — Главная</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Цвет темы -->
    <meta name="theme-color" content="#ffffff">
    <!-- iOS PWA настройки -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BestVersion">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* Стили для фона страницы */
        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            background-color: #dcdcdc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер, имитирующий экран мобильного телефона */
        .mobile-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            background-image: url('images/banner.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Контейнер для центрирования контента */
        .content {
            display: flex;
            flex-direction: column;
            /* ИЗМЕНЕНИЕ: Баннер теперь прижимается к низу контейнера */
            justify-content: flex-end;
            align-items: center;
            height: 100%;
            padding: 20px;
            /* ИЗМЕНЕНИЕ: Добавлен отступ, чтобы поднять баннер над кнопкой и нижней панелью */
            padding-bottom: 200px;
            box-sizing: border-box;
        }

        .banner {
            background: rgba(123, 131, 118, 0.8);
            padding: 24px 32px;
            border-radius: 16px;
            color: white;
            text-align: center;
            font-weight: 700;
            font-size: 1.5em;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            animation: fadeInDown 0.8s ease forwards;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            max-width: 90%;
        }

        .banner.show {
            opacity: 1;
        }

        .banner h1 {
            margin: 0 0 8px 0;
            font-size: 1.2em;
        }

        .banner p {
            margin: 0;
            font-size: 1rem;
            font-weight: 400;
        }

        /* Кнопка "Начать" */
        .start-btn {
            background: #5cbd0d;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 40px;
            font-size: 1.2em;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease;
            position: absolute;
            bottom: calc(90px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .start-btn:hover {
            background: #4a9c0a;
        }

        /* "Беговая дорожка" */
        .fitness-track {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            z-index: 1;
            overflow: hidden;
        }

        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .track-lines {
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
            height: 100%;
        }

        .track-line {
            height: 2px;
            background: rgba(255, 255, 255, 0.4);
            width: 200%;
            animation: trackLine 2s infinite linear;
        }

        @keyframes trackLine {
            0% {
                transform: translateX(-25%);
            }

            100% {
                transform: translateX(0%);
            }
        }

        /* ===== Install Banner ===== */
        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            color: #fff;
            padding: 1rem 1rem 1.2rem;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease-out;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .install-banner.show {
            display: flex;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .install-banner-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            width: 100%;
            max-width: 400px;
        }

        .install-banner-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .install-banner-text {
            flex: 1;
        }

        .install-banner-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 0 0 0.15rem;
        }

        .install-banner-subtitle {
            font-size: 0.8rem;
            opacity: 0.85;
            margin: 0;
            line-height: 1.3;
        }

        .install-banner-close {
            position: absolute;
            top: 0.5rem;
            right: 0.7rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem;
            line-height: 1;
        }

        .install-banner-btn {
            display: inline-block;
            padding: 0.65rem 1.8rem;
            background: #5cbd0d;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .install-banner-steps {
            font-size: 0.8rem;
            opacity: 0.9;
            text-align: center;
            line-height: 1.5;
            max-width: 340px;
        }

        .install-banner-steps b {
            color: #5cbd0d;
        }
    </style>
</head>

<body>

    <div class="mobile-frame">
        <div class="content">
            <div class="banner">
                <h1>"Лучшая версия себя"</h1>
                <p>Ваш путь к здоровью и силе начинается здесь</p>
            </div>
        </div>

        <a href="main.html" class="start-btn">Начать</a>

        <div class="fitness-track">
            <div class="track-lines">
                <div class="track-line"></div>
                <div class="track-line"></div>
                <div class="track-line"></div>
            </div>
        </div>
    </div>

    <!-- Install Banner -->
    <div class="install-banner" id="installBanner">
        <button class="install-banner-close" id="installClose" aria-label="Закрыть">&times;</button>
        <div class="install-banner-header">
            <img src="icon-192.png" alt="Icon" class="install-banner-icon">
            <div class="install-banner-text">
                <p class="install-banner-title" id="installTitle">Установите приложение</p>
                <p class="install-banner-subtitle" id="installSubtitle">Быстрый доступ с экрана "Домой"</p>
            </div>
        </div>
        <button class="install-banner-btn" id="installBtn">Установить</button>
        <div class="install-banner-steps" id="installSteps"></div>
    </div>

    <script>
        // Анимация баннера
        document.addEventListener('DOMContentLoaded', function () {
            const banner = document.querySelector('.banner');
            setTimeout(() => {
                banner.classList.add('show');
            }, 200);
        });

        // 1. Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }

        // 2. Логика баннера установки
        (function () {
            const banner = document.getElementById('installBanner');
            const btn = document.getElementById('installBtn');
            const closeBtn = document.getElementById('installClose');
            const stepsEl = document.getElementById('installSteps');
            const titleEl = document.getElementById('installTitle');
            const subtitleEl = document.getElementById('installSubtitle');

            // Если уже установлено как приложение — выходим
            if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;

            // === Определение платформы ===
            const ua = navigator.userAgent || '';
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/i.test(ua);

            // === Определение WebView (Telegram, Instagram, VK, Facebook) ===
            const isTelegram = /Telegram/i.test(ua);
            const isInstagram = /Instagram/i.test(ua);
            const isFacebook = /FBAN|FBAV/i.test(ua);
            const isVK = /VKAndroidApp|vk_app/i.test(ua);
            const isWebView = isTelegram || isInstagram || isFacebook || isVK || /\bwv\b/.test(ua);

            // === Определение браузера ===
            const isChrome = /Chrome/i.test(ua) && !/OPR|Opera|Edge|Edg|Samsung|UCBrowser|YaBrowser/i.test(ua) && !isWebView;
            const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|FxiOS|OPiOS|mercury|UCBrowser|YaBrowser/i.test(ua) && !isWebView;
            const isOpera = /OPR|Opera/i.test(ua);
            const isFirefox = /Firefox|FxiOS/i.test(ua);
            const isSamsung = /SamsungBrowser/i.test(ua);
            const isEdge = /Edg|Edge/i.test(ua);
            const isYandex = /YaBrowser/i.test(ua);
            const isUC = /UCBrowser/i.test(ua);

            // Браузер поддерживает установку? (только Chrome на Android/Desktop и Safari на iOS)
            const isSupportedBrowser = (isChrome && !isIOS) || (isSafari && isIOS);

            // localStorage не используем — полагаемся только на реальные проверки:
            // 1. display-mode: standalone (строка 326) = приложение запущено
            // 2. beforeinstallprompt = Chrome говорит "можно установить" = НЕ установлено

            let deferredPrompt = null;
            let bannerShown = false;

            // === Перехват события установки для Chrome ===
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                showBanner('native');
            });

            // === Таймер: если beforeinstallprompt не пришёл ===
            setTimeout(() => {
                if (bannerShown) return;

                if (isWebView) {
                    // Telegram / Instagram / VK / Facebook → копировать ссылку
                    showBanner('webview');
                } else if (isIOS && isSafari) {
                    // iOS Safari → инструкция "На экран Домой"
                    showBanner('ios-safari');
                } else if (isIOS && !isSafari) {
                    // iOS но НЕ Safari (Chrome iOS, Firefox iOS, Opera iOS) → откройте Safari
                    showBanner('ios-other');
                } else if (isAndroid && !deferredPrompt) {
                    // Android но НЕ Chrome (Opera, Firefox, Samsung, Yandex, UC)
                    showBanner('android-other');
                } else if (!isAndroid && !isIOS && !deferredPrompt) {
                    // Desktop без поддержки install prompt
                    showBanner('desktop-other');
                }
            }, 3000);

            // === Название текущего браузера ===
            function getBrowserName() {
                if (isTelegram) return 'Telegram';
                if (isInstagram) return 'Instagram';
                if (isFacebook) return 'Facebook';
                if (isVK) return 'ВКонтакте';
                if (isOpera) return 'Opera';
                if (isFirefox) return 'Firefox';
                if (isSamsung) return 'Samsung Internet';
                if (isEdge) return 'Edge';
                if (isYandex) return 'Яндекс Браузер';
                if (isUC) return 'UC Browser';
                return 'этот браузер';
            }

            // === Открыть в Chrome через Android Intent ===
            function openInChrome() {
                const currentUrl = window.location.href;
                const url = new URL(currentUrl);
                const intentUrl = 'intent://' + url.host + url.pathname + url.search + url.hash +
                    '#Intent;scheme=https;package=com.android.chrome;end';
                window.location.href = intentUrl;
            }

            // === Открыть в Safari через URL scheme (iOS) ===
            function openInSafari() {
                const currentUrl = window.location.href;
                const safariUrl = currentUrl
                    .replace(/^https:\/\//, 'x-safari-https://')
                    .replace(/^http:\/\//, 'x-safari-http://');
                window.location.href = safariUrl;
            }

            // === Скопировать ссылку (фоллбэк для десктопа) ===
            function copyLink(button) {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    button.textContent = '✓ Ссылка скопирована!';
                    setTimeout(() => { button.textContent = button.dataset.originalText || 'Скопировать ссылку'; }, 2500);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = window.location.href;
                    ta.style.cssText = 'position:fixed;opacity:0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    button.textContent = '✓ Ссылка скопирована!';
                    setTimeout(() => { button.textContent = button.dataset.originalText || 'Скопировать ссылку'; }, 2500);
                });
            }

            // === Показать баннер ===
            function showBanner(mode) {
                if (bannerShown) return;
                bannerShown = true;
                banner.classList.add('show');

                if (mode === 'native') {
                    // ✅ Chrome: нативная установка
                    titleEl.textContent = 'Установите приложение';
                    subtitleEl.textContent = 'Быстрый доступ с экрана "Домой"';
                    btn.textContent = 'Установить';
                    btn.style.display = 'inline-block';
                    stepsEl.innerHTML = '';
                    btn.onclick = async () => {
                        if (deferredPrompt) {
                            deferredPrompt.prompt();
                            const { outcome } = await deferredPrompt.userChoice;
                            if (outcome === 'accepted') {
                                banner.classList.remove('show');
                            }
                            deferredPrompt = null;
                        }
                    };

                } else if (mode === 'ios-safari') {
                    // 📱 iOS Safari: инструкция
                    titleEl.textContent = 'Добавьте на главный экран';
                    subtitleEl.textContent = 'Для быстрого доступа как приложение';
                    btn.style.display = 'none';
                    stepsEl.innerHTML = 'Нажмите <b>Поделиться</b> ' +
                        '<img src="https://ic.willsentance.com/share-ios.svg" style="height:1.1em;vertical-align:middle"> внизу экрана,<br>' +
                        'затем <b>«На экран «Домой»»</b>';

                } else if (mode === 'ios-other') {
                    // 📱 iOS, не Safari → перенаправить в Safari
                    const browserName = getBrowserName();
                    titleEl.textContent = 'Откройте в Safari';
                    subtitleEl.textContent = browserName + ' не поддерживает установку';
                    btn.textContent = 'Открыть в Safari';
                    btn.style.display = 'inline-block';
                    stepsEl.innerHTML = 'В Safari нажмите <b>Поделиться</b> → <b>«На экран Домой»</b>';
                    btn.onclick = () => {
                        navigator.clipboard.writeText(window.location.href).catch(() => { });
                        openInSafari();
                    };

                } else if (mode === 'android-other') {
                    // 🤖 Android, не Chrome → перенаправить в Chrome
                    const browserName = getBrowserName();
                    titleEl.textContent = 'Откройте в Chrome';
                    subtitleEl.textContent = browserName + ' не поддерживает установку';
                    btn.textContent = 'Открыть в Chrome';
                    btn.style.display = 'inline-block';
                    stepsEl.innerHTML = 'В Chrome появится кнопка <b>«Установить»</b>';
                    btn.onclick = () => { openInChrome(); };

                } else if (mode === 'webview') {
                    // 💬 Telegram / Instagram / VK / Facebook
                    const browserName = getBrowserName();
                    if (isAndroid) {
                        titleEl.textContent = 'Откройте в Chrome';
                        subtitleEl.textContent = 'Установка из ' + browserName + ' невозможна';
                        btn.textContent = 'Открыть в Chrome';
                        btn.style.display = 'inline-block';
                        stepsEl.innerHTML = 'В Chrome появится кнопка <b>«Установить»</b>';
                        btn.onclick = () => { openInChrome(); };
                    } else if (isIOS) {
                        titleEl.textContent = 'Откройте в Safari';
                        subtitleEl.textContent = 'Установка из ' + browserName + ' невозможна';
                        btn.textContent = 'Открыть в Safari';
                        btn.style.display = 'inline-block';
                        stepsEl.innerHTML = 'В Safari нажмите <b>Поделиться</b> → <b>«На экран Домой»</b>';
                        btn.onclick = () => {
                            navigator.clipboard.writeText(window.location.href).catch(() => { });
                            openInSafari();
                        };
                    } else {
                        titleEl.textContent = 'Откройте в Chrome';
                        subtitleEl.textContent = 'Для установки приложения';
                        btn.textContent = 'Скопировать ссылку';
                        btn.dataset.originalText = 'Скопировать ссылку';
                        btn.style.display = 'inline-block';
                        stepsEl.innerHTML = 'Откройте <b>Google Chrome</b> и вставьте ссылку';
                        btn.onclick = () => { copyLink(btn); };
                    }

                } else if (mode === 'desktop-other') {
                    // 🖥️ Десктоп (Firefox, Edge, Opera и т.д.)
                    titleEl.textContent = 'Откройте в Chrome';
                    subtitleEl.textContent = 'Для установки приложения';
                    btn.textContent = 'Скопировать ссылку';
                    btn.dataset.originalText = 'Скопировать ссылку';
                    btn.style.display = 'inline-block';
                    stepsEl.innerHTML = 'Откройте <b>Google Chrome</b> и вставьте ссылку.<br>Появится кнопка <b>«Установить»</b> в адресной строке.';
                    btn.onclick = () => { copyLink(btn); };
                }
            }

            // === Закрытие баннера (скрываем, но покажем снова при следующем визите) ===
            closeBtn.addEventListener('click', () => {
                banner.classList.remove('show');
            });
        })();
    </script>
</body>

</html>
