<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>Разминка/Заминка</title>
    <!-- ИЗМЕНЕНИЕ: Подключена библиотека иконок для нового меню -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ИЗМЕНЕНИЕ: Общие стили для "мобильной рамки" и фона */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #dcdcdc; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: #F9F4F2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            color: #333;
            text-decoration: none;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            text-align: center; /* Центрируем заголовок */
        }

        main {
            padding: 10px 16px;
            padding-bottom: 20px; /* Отступ снизу */
            flex-grow: 1;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        main::-webkit-scrollbar {
            display: none;
        }
        /* КОНЕЦ ИЗМЕНЕНИЙ для "мобильной рамки" */

        .videos-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto 16px auto;
        }
        .video-item {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin-bottom: 20px; /* Добавлен отступ для видео */
        }
        .video-item:last-child {
            margin-bottom: 0; /* Убираем отступ у последнего видео */
        }
        .video-preview {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 16px 16px 0 0;
        }
        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        .video-caption {
            padding: 16px 12px;
            font-size: 1em;
            color: #222;
            background: #faf9f6;
            border-radius: 0 0 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .video-caption h3 {
            margin: 0 0 4px 0;
            font-size: 1.2em;
            color: #2c3e50;
            font-weight: 600;
        }
        .video-caption p {
            margin: 0;
            font-size: 0.98em;
            color: #444;
        }
        
        /* ИЗМЕНЕНИЕ: Новые стили для нижнего меню */
        footer {
            flex-shrink: 0;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #E5E5EA;
            padding-top: 10px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8A8A8E;
            text-decoration: none;
            font-size: 10px;
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #7f817c;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <header>
            <a href="treningmain.html" class="back-button">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1>Разминка/Заминка</h1>
        </header>

        <main>
            <div class="videos-grid">
                <!-- Разминка -->
                <div class="video-item">
                    <div class="video-preview">
                        <video controls width="100%" preload="metadata">
                            <source src="https://storage2.bothelp.io/myuppy/01/0187/0187d88d6ea73a8ea14e38f918c1a6e8/IMG_2144__2_.mp4#t=0.1" type="video/mp4">
                            Ваш браузер не поддерживает видео.
                        </video>
                    </div>
                    <div class="video-caption">
                        <h3>Разминка</h3>
                        <p>Разминку перед каждым упражнением делать обязательно!!!</p>
                    </div>
                </div>
                <!-- МФР -->
                <div class="video-item">
                    <div class="video-preview">
                        <video controls width="100%" preload="metadata">
                            <source src="https://storage2.bothelp.io/myuppy/44/440c/440cc02d4955562e130a92c2f9eab8f3/IMG_1554.mp4#t=0.1" type="video/mp4">
                            Ваш браузер не поддерживает видео.
                        </video>
                    </div>
                    <div class="video-caption">
                        <h3>МФР</h3>
                    </div>
                </div>
                <!-- Мобильность тазобедренного сустава 1 -->
                <div class="video-item">
                    <div class="video-preview">
                        <video controls width="100%" preload="metadata">
                            <source src="https://storage2.bothelp.io/myuppy/29/299d/299dc8c02629f64a0d17cb5df2bbebcf/IMG_1537.mp4#t=0.1" type="video/mp4">
                            Ваш браузер не поддерживает видео.
                        </video>
                    </div>
                    <div class="video-caption">
                        <h3>Мобильность тазобедренного сустава 1</h3>
                    </div>
                </div>
                <!-- Мобильность тазобедренного сустава 2 -->
                <div class="video-item">
                    <div class="video-preview">
                        <video controls width="100%" preload="metadata">
                            <source src="https://storage2.bothelp.io/myuppy/48/48bb/48bb953334f1da421987c8f8046ebc81/IMG_1538.mp4#t=0.1" type="video/mp4">
                            Ваш браузер не поддерживает видео.
                        </video>
                    </div>
                    <div class="video-caption">
                        <h3>Мобильность тазобедренного сустава 2</h3>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <nav class="bottom-nav">
                <a href="main.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Главная</span>
                </a>
                <!-- Вкладка "Тренировки" активна -->
                <a href="treningmain.html" class="nav-item active">
                    <i class="fa-solid fa-dumbbell"></i>
                    <span>Тренировки</span>
                </a>
                <a href="foodmain.html" class="nav-item">
                    <i class="fa-solid fa-utensils"></i>
                    <span>Питание</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Профиль</span>
                </a>
            </nav>
        </footer>
    </div>

    <script>
        // Возвращаем видео на начало при первом запуске (чтобы не было задержки на кадре из #t=0.1)
        document.querySelectorAll('video').forEach(video => {
            video.addEventListener('play', function() {
                this.currentTime = 0;
            }, { once: true });
        });
    </script>
</body>
</html>
