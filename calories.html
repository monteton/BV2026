<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Питание</title>
    <style>
        body {
            background: #faf9f6;
            color: #222;
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 16px 90px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin: 0 0 20px 0;
            font-size: 1.8em;
        }

        .calorie-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin-bottom: 20px;
        }

        .calorie-btn,
        .menu-btn,
        .calorazh-btn {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #222;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .calorie-btn:hover,
        .menu-btn:hover,
        .calorazh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(44, 62, 80, 0.13);
        }

        /* Видео */
        .videos-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
            margin: 16px 0;
        }

        .video-item {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .video-preview {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 16px 16px 0 0;
        }

        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .video-caption {
            padding: 12px 8px;
            font-size: 1rem;
            color: #222;
            text-align: center;
            background: #faf9f6;
            border-radius: 0 0 16px 16px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 66px;
            z-index: 100;
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 0.93em;
            gap: 2px;
            transition: color 0.2s;
            padding: 6px 0;
            min-width: 54px;
            max-width: 80px;
            overflow: hidden;
            white-space: nowrap;
        }

        .nav-item.active,
        .nav-item:active {
            color: #222;
        }

        .nav-icon {
            font-size: 1.34em;
            line-height: 1;
        }

        .nav-label {
            font-size: 0.91em;
            line-height: 1.1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Питание</h1>

        <!-- Кнопка на calorazh.ru -->
        <a href="https://calorazh.ru/" target="_blank" class="calorazh-btn">
            Калькулятор калорий (Calorazh.ru)
        </a>

        <!-- Кнопки калорийности -->
        <div class="calorie-grid">
            <button class="calorie-btn" onclick="openPdf('pdfs/1300call.pdf', '1300 ккал')">1300 ккал</button>
            <button class="calorie-btn"
                onclick="openPdf('pdfs/Menyu_1400-1500_kaloriy.pdf', '1400-1500 ккал')">1400-1500 ккал</button>
            <button class="calorie-btn" onclick="openPdf('pdfs/Menyu1500-1600_kaloriy.pdf', '1500-1600 ккал')">1500-1600
                ккал</button>
            <button class="calorie-btn"
                onclick="openPdf('pdfs/Menyu_1600-1700_kaloriy.pdf', '1600-1700 ккал')">1600-1700 ккал</button>
            <button class="calorie-btn"
                onclick="openPdf('pdfs/Menyu_1700-1800_kaloriy.pdf', '1700-1800 ккал')">1700-1800 ккал</button>
            <button class="calorie-btn" onclick="openPdf('pdfs/postnoe.pdf', 'Постное меню')">Постное меню</button>
        </div>

        <!-- Видео -->
        <div class="videos-grid">
            <div class="video-item">
                <div class="video-preview">
                    <video controls width="100%" style="aspect-ratio: 9 / 16;" preload="metadata">
                        <source
                            src="https://storage2.bothelp.io/myuppy/a5/a519/a5196261f3cec9d980791446a8720137/urok1_1.mp4#t=0.1"
                            type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div class="video-caption">Индивидуальный подсчет калорийности</div>
            </div>
            <div class="video-item">
                <div class="video-preview">
                    <video controls width="100%" style="aspect-ratio: 9 / 16;" preload="metadata">
                        <source
                            src="https://storage2.bothelp.io/myuppy/47/4714/4714b0f1298aca36a961147cd66ff21b/Urok_2.mp4#t=0.1"
                            type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div class="video-caption">Индивидуальный разбор КБЖУ</div>
            </div>
            <div class="video-item">
                <div class="video-preview">
                    <video controls width="100%" style="aspect-ratio: 9 / 16;" preload="metadata">
                        <source
                            src="https://storage2.bothelp.io/myuppy/86/86a9/86a9725b373d1c7041f76e628e5ea154/IMG_1518.mp4#t=0.1"
                            type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div class="video-caption">Составляем рацион под свои запросы и цели</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">&#8962;</span>
            <span class="nav-label">Главная</span>
        </a>
        <a href="trainings.html" class="nav-item">
            <span class="nav-icon">&#128170;</span>
            <span class="nav-label">Тренировки</span>
        </a>
        <a href="food.html" class="nav-item active">
            <span class="nav-icon">&#127828;</span>
            <span class="nav-label">Питание</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">&#128100;</span>
            <span class="nav-label">Профиль</span>
        </a>
    </nav>

    <script>
        function openPdf(pdfUrl, title) {
            const params = new URLSearchParams();
            params.set('file', pdfUrl);
            params.set('back', 'calories.html');
            if (title) params.set('title', title);
            window.location.href = 'view-pdf.html?' + params.toString();
        }
    </script>
</body>

</html>
